name: Test Tag Fetching

on:
  workflow_dispatch:

jobs:
  test-tags-py:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Fetch Latest Release Tags using Python
        id: get_tags_py
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
        run: |
          python3 << 'EOF'
          import requests
          import json
          import os

          REPOS = [
              {"owner": "ITV", "repo": "tf-gcp-data-bucket"},
              {"owner": "ITV", "repo": "tf-gcp-data-bigquery"},
              {"owner": "ITV", "repo": "tf-azure-data-bigquery"},
          ]

          tags = {}
          gh_token = os.environ.get("GH_TOKEN")
          headers = {"Accept": "application/vnd.github.v3+json"}
          if gh_token:
              headers["Authorization"] = f"token {gh_token}"

          for item in REPOS:
              owner = item["owner"]
              repo = item["repo"]
              key = f"{owner}_{repo}".replace('-', '_').replace('.', '_')

              api_url = f"https://api.github.com/repos/{owner}/{repo}/releases/latest"
              print(f"Fetching: {api_url}")
              try:
                  response = requests.get(api_url, headers=headers, timeout=10)
                  response.raise_for_status()
                  data = response.json()
                  latest_tag = data.get("tag_name", "v0.0.0")
                  tags[key] = latest_tag
                  print(f"Fetched tag for {owner}/{repo}: {latest_tag}")
              except requests.exceptions.HTTPError as e:
                  if response.status_code == 404:
                      tags[key] = "v0.0.0"
                      print(f"Warning: No latest release for {owner}/{repo}. Defaulting to v0.0.0.")
                  else:
                      tags[key] = "v0.0.0"
                      print(f"Error fetching {owner}/{repo}. Status: {response.status_code}. Defaulting to v0.0.0. Error: {e}")
              except Exception as e:
                  tags[key] = "v0.0.0"
                  print(f"Unexpected error for {owner}/{repo}: {e}")

          tag_output = json.dumps(tags)
          print(f"::set-output name=latest_tags::{tag_output}")
          print(f"Final JSON output: {tag_output}")
          EOF

      - name: Display Final JSON Output
        run: |
          echo "--- RESULT ---"
          echo "${{ steps.get_tags_py.outputs.latest_tags }}"
          echo "--------------"
