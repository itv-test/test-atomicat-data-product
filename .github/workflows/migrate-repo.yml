name: Migrate Repo

on:
  workflow_dispatch:
    inputs:
        environment:
          description: Target environment to deploy to
          required: true
          type: choice
          options:
            - dev
        name:
            description: 'Data Product Name (excluding "-data-product" suffix)'
            required: true
            type: string
        domain:
            description: 'Domain'
            default: ''
            required: true
            type: choice
            options:
              - 'commercial'
              - 'content'
              - 'marketing'
              - 'operational'
              - 'publication'
              - 'viewer'
        data_product_owner:
            description: 'Data Product Owner'
            default: "CHANGE_ME@itv.com"
            required: true
            type: string
        technical_owner:
            description: 'Technical Owner - aka engineering team'
            default: "CHANGE_ME@itv.com"
            required: true
            type: string
        github_team:
            description: 'GitHub Team'
            default: ''
            required: true
            type: choice
            options:
                - 'data-mesh-bprf'
                - 'cde'
                - 'central-data-platform'
                - 'data-mesh-commercial'
                - 'data-mesh-id-p'
                - 'data-mesh-machine-learning'
                - 'data-mesh-marketing'
                - 'data-mesh-marketing-data-science'
                - 'data-mesh-platform'
                - 'data-mesh-product-experience'
                - 'data-mesh-qa-test'
                - 'data-mesh-racs-migration'
                - 'data-mesh-viewer'
                - 'insight-group-analytics'
                - 'insights-group-data-science'
                - 'central-data'


run-name: "Migrating: ${{ inputs.name }} | Started by: ${{ github.actor }}"
jobs:
    configure-and-migrate-repo:
        runs-on: ubuntu-latest
        permissions: write-all
        steps:
            - name: Install Python & Dependencies
              run: |
                echo "Installing python & required dependencies"
                sudo apt-get update
                sudo apt-get install python3
                pip3 install -r requirements.txt

            - name: Check out repo's default branch
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                token: ${{ secrets.GH_BOT_TOKEN }}

            - name: Validate tokens
              env:
                ORG_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
              run: |
                python3 validate_tokens.py

            - name: Get authenticated user
              env:
                GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
              run: |
                AUTHENTICATED_USER=$(curl -s -H "Authorization: token ${{ secrets.GH_BOT_TOKEN }}" https://api.github.com/user | jq -r '.login')
                echo "AUTHENTICATED_USER=$AUTHENTICATED_USER" >> $GITHUB_ENV

            - name: Validate input form
              env:
                GHA_DOMAIN: ${{ inputs.domain }}
                GHA_PRODUCT_NAME: ${{ inputs.name }}
              run: |
                echo "Validating user workflow input"
                python3 validator.py

            - name: Clone target repo and run migration
              env:
                GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
                GH_REPO_NAME: ${{ inputs.name }}-data-product
              run: |
                gh repo clone ITV/$GH_REPO_NAME
                cd $GH_REPO_NAME
                python3 ../migration_scripts/main.py --domain ${{ inputs.domain }} --product-name ${{ inputs.name }} --data-product-owner ${{ inputs.data_product_owner }} --technical-owner ${{ inputs.technical_owner }}

            - name: Copy Cortex GHA Workflows
              env:
                GH_REPO_NAME: ${{ inputs.name }}-data-product
              run: |
                mkdir -p $GH_REPO_NAME/.github/workflows
                cp -r github_workflows/* $GH_REPO_NAME/.github/workflows/

            - name: Delete existing cortex branch if it exists
              env:
                GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
                GH_REPO_NAME: ${{ inputs.name }}-data-product
              run: |
                cd $GH_REPO_NAME
                # Delete remote cortex branch if it exists
                gh api repos/ITV/$GH_REPO_NAME/git/refs/heads/cortex --method DELETE || echo "Branch cortex does not exist remotely"
                # Delete local cortex branch if it exists
                git branch -D cortex || echo "Branch cortex does not exist locally"

            - name: Apply repo settings and security ruleset
              env:
                GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
                GH_REPO_NAME: ${{ inputs.name }}-data-product
                GHA_DOMAIN: ${{ inputs.domain }}
                GHA_USER: ${{ github.actor }}
                GHA_GH_TEAM: ${{ inputs.github_team }}
              run: |
                cd $GH_REPO_NAME
                export AUTHORISED_USER=$(curl -s -H "Authorization: token ${{ secrets.GH_BOT_TOKEN }}" https://api.github.com/user | jq -r '.login')
                python3 ../apply_repo_settings.py

            - name: Configure Git Signing
              uses: ITV/itv-data-actions/composite-actions/commit-signing@main
              with:
                git-signing-key: ${{ secrets.GH_BOT_SIGN_KEY }}

            - name: Create cortex branch and commit changes
              env:
                GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
                GH_REPO_NAME: ${{ inputs.name }}-data-product
              run: |
                cd $GH_REPO_NAME
                git checkout -b cortex
                git add .
                git commit -m "Migrate repository using Cortex template" || echo "No changes to commit"
                git push origin cortex

            - name: Create Pull Request
              env:
                GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
                GH_REPO_NAME: ${{ inputs.name }}-data-product
              run: |
                cd $GH_REPO_NAME
                gh pr create \
                  --title "Cortex Migration: Update repository structure and workflows" \
                  --body "This PR migrates the repository to use the Cortex template structure.

                ## Changes:
                - Updated repository structure to match Cortex template
                - Added/updated GitHub Actions workflows
                - Applied repository settings and security rulesets
                - Created config yaml file using magic yaml

                ## Migration Details:
                - Data Product: ${{ inputs.name }}
                - Domain: ${{ inputs.domain }}
                - Data Product Owner: ${{ inputs.data_product_owner }}
                - Technical Owner: ${{ inputs.technical_owner }}
                - GitHub Team: ${{ inputs.github_team }}

                Please review and merge when ready." \
                  --head cortex \
                  --base "$(git remote show origin | awk '/HEAD branch/ {print $NF}')" \
                  --reviewer ${{ inputs.github_team }}
