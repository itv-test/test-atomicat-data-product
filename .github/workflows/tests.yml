name: Tests

on:
  pull_request:
    branches: ["main", "master"]

run-name: "Running tests using ${{ github.head_ref }} | Started by: ${{ github.actor }}"

jobs:
  ci-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.12'
      - name: Install global dependencies
        run: |
          pip install flake8 coverage pytest poetry
      - name: Run template tests
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          .venv/bin/python -m pip install flake8 coverage pytest
          python -m flake8 . --exclude=.venv/ --ignore=E501,W503 --max-line-length 120
          python -m coverage run -m pytest "tests/" "-v" "-s"
          deactivate
      - name: Run apply-pre-commit tests
        run: |
          git config --global user.name "itv-cortex-bot"
          git config --global user.email "cortex-github-bot-group@itv.com"
          cd .github/workflows/apply-pre-commit
          poetry install
          poetry run flake8 . --exclude=.venv/ --ignore=E501,W503 --max-line-length 120
          poetry run coverage run -m pytest "tests/" "-v" "-s"
          poetry run coverage report --fail-under=80
